<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Office Day Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <?!= Include('Theme' + theme) ?>
  <?!= Include('Styles') ?>
</head>
<body class="<?!= isDark ? 'dark' : '' ?>">

<button class="theme-toggle" onclick="toggleDark(this)" title="Toggle dark mode"><?!= isDark ? '☀️' : '🌙' ?></button>
<script>var APP_URL = '<?!= ScriptApp.getService().getUrl() ?>';</script>
<button class="refresh-btn" onclick="refreshData(this)" title="Refresh data">↻</button>

<!-- ======== MAIN VIEW (office / home / weekend / logged) ======== -->
<div id="view-main" class="view">
  <div class="container">
    <? if (data.status !== 'fatal' && data.status !== 'unauth') { ?>
    <?!= Include('TitleCard') ?>
    <?!= Include('RingsCard') ?>
    <?!= Include('DaysCard') ?>
    <?!= Include('CalendarCard') ?>
    <?!= Include('StatisticsCard') ?>
    <? } ?>
  </div>
</div>

<!-- ======== FATAL ERROR ======== -->
<div id="view-fatal" class="view">
  <? if (data.status === 'fatal') { ?>
  <?!= Include('FatalErrorCard') ?>
  <? } ?>
</div>

<!-- ======== UNAUTHORIZED ======== -->
<div id="view-unauth" class="view">
  <?!= Include('UnauthorizedCard') ?>
</div>

<?!= Include('JavaScript') ?>

</body>
</html>
